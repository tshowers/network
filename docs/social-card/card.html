<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:#fff;color:#0f1115;position:relative}
.copy{position:absolute;left:72px;top:64px;width:600px}
.brand{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.brand img{width:52px;height:52px;border-radius:13px}
.flow{display:flex;align-items:center;gap:8px;margin-top:52px}
.flow span{height:34px;padding:0 14px;border-radius:999px;background:#e3ecff;color:#1d4fd6;font-size:16px;font-weight:700;display:inline-flex;align-items:center}
.flow i{color:#5a6170;font-style:normal;font-size:16px}
h1{margin-top:26px;font-size:66px;line-height:.98;letter-spacing:-.05em;font-weight:700}
p{margin-top:24px;font-size:22px;color:#5a6170;font-weight:500}
.disc{position:absolute;right:-60px;top:70px;width:560px;height:560px;border-radius:50%;background:#e3ecff}
.shot{position:absolute;right:84px;top:56px;width:400px;height:500px;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(15,17,21,.18)}
.shot img{width:100%;display:block}
</style></head><body>
<div class="disc"></div>
<div class="shot"><img src="frame.png"></div>
<div class="copy">
  <div class="brand"><img src="icon.png">Network</div>
  <div class="flow"><span>Relationships</span><i>→</i><span>Attention</span><i>→</i><span>Opportunities</span><i>→</i><span>Revenue</span></div>
  <h1>Get clients.<br>Keep clients.</h1>
  <p>Your next client is probably someone you already know.</p>
</div>
</body></html>
