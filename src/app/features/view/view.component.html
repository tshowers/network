<!-- Contact detail (design_handoff_network_contact_detail 15t; 15u/15v on iPhone). -->
<app-preloader [isLoading]="isLoading"></app-preloader>
<app-back-to-top></app-back-to-top>
<main class="nw-page cv" data-cy="contact-view-shell" *ngIf="contact">
  <div class="cv-bar">
    <a class="nw-link cv-back" routerLink="/contact-list" aria-label="Back to Contacts">
      <svg class="nw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Contacts</span>
    </a>
    <span class="cv-title">Contact</span>
    <div class="nw-seg cv-seg" role="tablist" aria-label="Contact view">
      <button type="button" role="tab" [class.is-on]="activeTab === 'read'" [attr.aria-selected]="activeTab === 'read'" (click)="activeTab = 'read'">Regular view</button>
      <button type="button" role="tab" [class.is-on]="activeTab === 'json'" [attr.aria-selected]="activeTab === 'json'" (click)="activeTab = 'json'">Raw JSON</button>
    </div>
    <button type="button" class="nw-btn nw-btn--primary cv-edit" data-cy="contact-read-edit" (click)="navigateToEditContact()">
      <svg class="nw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2.1 2.1 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
      <span class="cv-edit__long">Edit contact</span><span class="cv-edit__short">Edit</span>
    </button>
  </div>

  <app-read *ngIf="activeTab === 'read'" [contact]="contact" [isPublicProfile]="false" [showAdditionalInfo]="true" [userId]="userId"></app-read>
  <pre class="cv-json" *ngIf="activeTab === 'json'"><code>{{ contact | json }}</code></pre>
</main>
<main class="nw-page" *ngIf="!contact && !isLoading">
  <div class="cv-empty" role="alert">
    <h1>Nothing found</h1>
    <p>{{ errorMessage || 'No data found for requested contact.' }}</p>
    <a class="nw-btn" routerLink="/contact-list">Back to Contacts</a>
  </div>
</main>
