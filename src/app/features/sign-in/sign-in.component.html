<div class="sign-in-shell">
  <div class="sign-in-card">
    <h1 class="mb-1">Sign in to Network</h1>
    <p class="text-muted mb-4">Access your relationship graph.</p>

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="button" class="btn btn-outline-dark w-100 mb-3" [disabled]="isSigningIn" (click)="signInWithGoogle()">
      <i class="fa-brands fa-google me-2"></i>
      Continue with Google
    </button>

    <div class="sign-in-divider"><span>or</span></div>

    <form (ngSubmit)="signInWithEmail()" #form="ngForm">
      <div class="form-group mb-2">
        <label>Email</label>
        <input type="email" class="form-control" name="email" [(ngModel)]="email" placeholder="you@company.com" />
      </div>
      <div class="form-group mb-3">
        <label>Password</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" />
      </div>
      <button type="submit" class="btn btn-dark w-100" [disabled]="isSigningIn">
        {{ isSigningIn ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
