<main class="si" data-cy="sign-in-shell">
  <section class="si-card">
    <img class="si-logo" src="assets/TODD-icon.png" alt="TODD" width="56" height="56" />
    <h1>Sign in</h1>
    <p>Sign in with your TODD account to continue.</p>
    <button type="button" class="nw-btn nw-btn--primary si-btn" [disabled]="isSigningIn" (click)="signIn()">{{ isSigningIn ? 'Redirecting…' : 'Sign in with TODD' }}</button>
    <a class="si-new" routerLink="/get-started">New to Network? Get started</a>
  </section>
</main>
