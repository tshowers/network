<div class="sign-in-shell">
  <div class="sign-in-card" *ngIf="view === 'form'">
    <img class="sign-in-logo" src="assets/todd-icon.png" alt="TODD" />

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form (ngSubmit)="sendSignInLink()" #form="ngForm">
      <div class="form-group mb-3">
        <label>Email</label>
        <input type="email" class="form-control" name="emailAddress" [(ngModel)]="emailAddress" placeholder="you@company.com" required />
      </div>
      <button type="submit" class="btn btn-dark w-100" [disabled]="isSigningIn">
        {{ isSigningIn ? 'Sending...' : 'Email me a sign-in link' }}
      </button>
    </form>

    <div class="sign-in-divider"><span>or</span></div>

    <button type="button" class="btn btn-outline-dark w-100 mb-2" [disabled]="isSigningIn" (click)="signInWithApple()">
      <i class="fa-brands fa-apple me-2"></i>
      Continue with Apple
    </button>
    <button type="button" class="btn btn-outline-dark w-100" [disabled]="isSigningIn" (click)="signInWithGoogle()">
      <i class="fa-brands fa-google me-2"></i>
      Continue with Google
    </button>
  </div>

  <div class="sign-in-card sign-in-card--sent" *ngIf="view === 'sent'">
    <div class="sign-in-sent-icon"><i class="fa-solid fa-envelope-circle-check"></i></div>
    <h1 class="mb-1">Check your email</h1>
    <p class="text-muted mb-0">We sent a secure sign-in link to <strong>{{ emailAddress }}</strong>.</p>
    <p class="text-muted mb-4">Open it on this device to finish signing in. Check your spam folder if it doesn't show up.</p>
    <button type="button" class="btn btn-outline-dark w-100" (click)="resendLink()">Use a different email</button>
  </div>
</div>
