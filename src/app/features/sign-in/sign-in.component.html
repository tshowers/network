<main class="si" data-cy="sign-in-shell">
  <section class="si-card">
    <img class="si-logo brand-mark--light" src="assets/brand/products/svg/light/04-network.svg" alt="Network" width="56" height="56" /><img class="si-logo brand-mark--dark" src="assets/brand/products/svg/dark/04-network.svg" alt="" width="56" height="56" />
    <h1>Sign in</h1>
    <p>Sign in with your 16Ahead account to continue.</p>
    <button type="button" class="nw-btn nw-btn--primary si-btn" [disabled]="isSigningIn" (click)="signIn()">{{ isSigningIn ? 'Redirecting…' : 'Sign in with 16Ahead' }}</button>
    <a class="si-new" routerLink="/get-started">New to Network? Get started</a>
  </section>
</main>
