<div class="network-ambient" aria-hidden="true">
  <span class="network-ambient__glow network-ambient__glow--a"></span>
  <span class="network-ambient__glow network-ambient__glow--b"></span>
</div>
<div class="app-global-actions" *ngIf="!isEmbedded">
  <span class="network-utility-mark">NETWORK <i>·</i> RELATIONSHIP OS</span>
  <app-theme-toggle />
  <app-platform-menu [isAdmin]="(isAdmin$ | async) ?? false" [isLoggedIn]="(isLoggedIn$ | async) ?? false" (signOut)="signOut()" />
</div>
<app-command-palette />
<router-outlet></router-outlet>
<app-network-assistant-launcher *ngIf="!isEmbedded"></app-network-assistant-launcher>
<app-toast></app-toast>
<div *ngIf="updateNotice" class="network-update-notice" role="status" aria-live="polite">
  <span>{{ updateNotice }}</span>
  <button *ngIf="chunkRecoveryNeedsManualRefresh" type="button" (click)="refreshAfterChunkError()">Refresh</button>
  <button *ngIf="!chunkRecoveryNeedsManualRefresh" type="button" aria-label="Dismiss update notification" (click)="dismissUpdateNotice()">×</button>
</div>
